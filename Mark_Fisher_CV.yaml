    summary:
      - "I am a biologist, educator, software developer, and queer athlete and athletics advocate who combines outdoor field teaching, inclusive group facilitation, and practical program coordination. I have spent over a cumulative year teaching and conducting research in Costa Rica and have led three study abroad biology programs there, guiding participants through wildlife-focused field experiences while supporting safety, adaptability, and group wellbeing. Alongside this work, I am a long-term queer community athletics instructor (BJJ black belt, 21 years) with over a decade of teaching experience in queer spaces. Professionally, I currently support open-source biodiversity infrastructure through Symbiota at the University of Kansas, where I contribute software development, mentorship, and cross-team collaboration."
