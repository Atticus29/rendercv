          - (Ongoing) Working directly with the Antenna team to understand system requirements, characterize scientific use cases, and providing my own use case in the field in Costa Rica
          - Familiarized myself with large-scale data processing pipelines and preprocessing workflows by creating my own detector trained on photographic data at a study site I still regularly visit and capture from. [Example Jupyter notebook](https://github.com/Atticus29/cr_moth/blob/main/1_dataset_prep/dataset_prep.ipynb)
